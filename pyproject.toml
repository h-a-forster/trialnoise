[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trialnoise"
version = "0.1.0"
description = "Variance components of the public Terminal-Bench 2 leaderboard, and a calibrated calculator for how many trials and tasks a comparison needs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "trialnoise contributors" }]
keywords = [
    "llm evaluation", "agent evaluation", "variance components", "power analysis",
    "minimum detectable effect", "terminal-bench", "cluster bootstrap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=15", "statsmodels>=0.14.2"]

[project.urls]
Homepage = "https://github.com/h-a-forster/trialnoise"
Documentation = "https://github.com/h-a-forster/trialnoise/tree/main/docs"
Issues = "https://github.com/h-a-forster/trialnoise/issues"

[project.scripts]
trialnoise = "trialnoise.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
# Lock only releases at least two weeks old; move this date deliberately.
exclude-newer = "2026-10-16T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/trialnoise"]

[tool.hatch.build.targets.sdist]
include = [
    "src/trialnoise", "tests", "docs", "configs", "results", "uv.lock",
    "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: Monte Carlo checks that take more than a few seconds (run with --runslow)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A Markdown table of links cannot wrap.
"src/trialnoise/report_text.py" = ["E501"]
