name: CI

# No push trigger: Actions minutes are metered while the repository is private.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked --group dev

      - name: Test
        run: uv run pytest

      - name: Test on the lowest declared dependencies
        if: matrix.python == '3.11'
        run: |
          uv venv .venv-lowest
          uv pip install --python .venv-lowest --resolution lowest-direct . "pytest>=8" "statsmodels>=0.14.2"
          .venv-lowest/bin/python -m pytest

      - name: CLI smoke
        # bash on every OS: pwsh would only fail on the last line's exit code.
        shell: bash
        run: |
          uv run trialnoise --version
          uv run trialnoise power --comparison same-model --band high --gap 3
          uv run trialnoise pairs --top 3
